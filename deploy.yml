# ============================================================================
# Front Deploy - Request Watcher  (HIBRIT TOPOLOJI)
# ============================================================================
# NEDEN HIBRIT:
#   - KYS/token API ve artifact repo erisimi YALNIZCA INFPRDDIAG'dan acik
#     -> bu adimlar Windows hedefinde (win_* modulleri) calisir.
#   - NetApp SMB erisimi YALNIZCA OpenShift cluster IP'lerinden acik
#     -> yazma adimi delegate_to: localhost ile EE pod'unda smbclient ile yapilir.
#
#   AKIS:  [DIAG] token -> talep -> detay -> indir
#          -> fetch (DIAG -> EE)
#          -> [EE/OCP] smbclient ile NetApp'e yaz
#          -> [DIAG] statu guncelle   <-- enable_status_updates ile KAPALI (false)
#
#   enable_status_updates=false oldugu surece KYS kayitlarina hic POST
#   atilmaz (eski davranis). Sadece tespit + indirme + NetApp'e yazma.
#
# GEREKSINIM (EE tarafinda): samba-client paketi (smbclient binary).
#   Custom EE'ye eklenmesi gerekir:  RUN dnf install -y samba-client
#
# EXTRA VARS (AAP - sifreli/Survey):
#   proxy_user, proxy_password, proxy_url (ops.), deploy_api_token (fallback),
#   smb_user, smb_password
# ============================================================================

- name: Front Deploy - Request Watcher
  hosts: windows_targets          # INFPRDDIAG
  gather_facts: false

  vars:
    # --- API ---
    # --- Ortam anahtari (test dogrulamasi icin) ---
    # AAP extra var: calisma_modu: "test"  -> kysbackendtest'e baglanir
    #                calisma_modu: "prod"  -> gercek KYS'ye baglanir (varsayilan)
    # Dogrulama tamamlaninca bu iki degiskeni kaldirip web_service_url'i
    # dogrudan prod degerine sabitleyebilirsiniz.
    calisma_modu: "prod"
    web_service_url_test: "https://kysbackendtest.ibtech.com.tr/api"
    web_service_url_prod: "https://kysbackend.ibtech.com.tr/api"
    web_service_url: "{{ web_service_url_test if calisma_modu == 'test' else web_service_url_prod }}"
    token_api_url: "https://infraapps.qnb.com.tr/api/GetTokenKysApi/GetData"
    deploy_environments: [test, preprod, prod]
    talep_page_size: 100
    talep_max_pages: 3            # env basina cekilecek sayfa (3 x 100 = 300 kayit)
    http_timeout_seconds: 30

    # --- Staging (DIAG uzerinde gecici indirme alani) ---
    win_stage_dir: 'D:\temp\frontdeploy_stage'
    ee_stage_dir: '/tmp/frontdeploy'

    # --- NetApp / SMB (hedef: OCP pod'undan yazilir) ---
    repo_shares:
      istanbul: '//10.81.204.231/deployrepo'
      ankara:   '//10.25.204.231/deployrepo_ank'
    env_repo_share:
      test: istanbul
      preprod: istanbul
      prod: istanbul

    # --- Kilitler ---
    enable_processing: true         # indirme + NetApp'e yazma
    # KAPALI: talep/detay statusu DEGISMEZ, release history YAZILMAZ.
    # Indirme/NetApp tarafi tamamen dogrulanana kadar false kalsin.
    # Acmak icin AAP extra var: enable_status_updates: true
    enable_status_updates: false

    # --- Mail ---
    mail_smtp_host: "mailgw.finansbank.com.tr"
    mail_smtp_port: 25
    mail_from: "ansible@qnbfinansbank.com"
    mail_to: "bahadir.gokdemir@ibtech.com.tr"

  tasks:

    # ========================================================
    # 01 - Tarih (dizin sablonu icin)
    # ========================================================
    - name: "01 - Tarih bilgisi"
      ansible.builtin.set_fact:
        dt:
          year: "{{ '%Y' | strftime }}"
          month: "{{ '%m' | strftime }}"
          day: "{{ '%d' | strftime }}"
          stamp: "{{ '%Y%m%d%H%M%S' | strftime }}"

    # ========================================================
    # 02 - Token (proxy NTLM gerektigi icin tek PS blogu kaldi;
    #      uri/win_uri NTLM proxy auth yapamiyor)
    # ========================================================
    - name: "02 - Token al (GetTokenKysApi, proxy NTLM)"
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $cred = New-Object System.Management.Automation.PSCredential(
              '{{ proxy_user }}',
              (ConvertTo-SecureString '{{ proxy_password }}' -AsPlainText -Force))
          $args = @{ Uri = '{{ token_api_url }}'; Method = 'Get'
                     TimeoutSec = {{ http_timeout_seconds }}; UseBasicParsing = $true
                     Credential = $cred }
          $p = '{{ proxy_url | default("") }}'
          if (-not $p) {
              $ie = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -EA SilentlyContinue).ProxyServer
              if ($ie) { $p = "http://$ie" }
          }
          if ($p) { $args['Proxy'] = $p; $args['ProxyCredential'] = $cred }
          try {
              $t = (Invoke-WebRequest @args).Content.Trim()
              if (-not $t.StartsWith('eyJ')) { throw "gecersiz token" }
              @{ ok = $true; token = $t } | ConvertTo-Json -Compress
          } catch {
              @{ ok = $false; token = ''; error = $_.Exception.Message } | ConvertTo-Json -Compress
          }
      register: token_raw
      changed_when: false
      no_log: true

    - name: "02b - Tokeni ayarla (otomatik / statik fallback)"
      ansible.builtin.set_fact:
        tf: "{{ token_raw.output[0] | from_json }}"
      no_log: true

    - name: "02c - deploy_token"
      ansible.builtin.set_fact:
        deploy_token: "{{ tf.token if tf.ok else (deploy_api_token | default('')) }}"
      no_log: true

    - name: "02d - Token yoksa dur"
      ansible.builtin.fail:
        msg: "Kullanilacak token yok. Otomatik alim hatasi: {{ tf.error | default('-') }}"
      when: deploy_token | length == 0

    # ========================================================
    # 03 - Get-Talep (state:YT) - ortam x sayfa
    # ========================================================
    - name: "03 - YT talepleri cek"
      ansible.windows.win_uri:
        url: "{{ (web_service_url ~ '/comprepo-deployment-requests?search=state:YT AND envName:' ~ item.0 ~ '&page=' ~ item.1 ~ '&pageSize=' ~ talep_page_size) | replace(' ', '%20') }}"
        method: GET
        headers:
          Authorization: "Bearer {{ deploy_token }}"
        return_content: true
      loop: "{{ deploy_environments | product(range(1, talep_max_pages + 1)) | list }}"
      loop_control:
        label: "{{ item.0 }} / sayfa {{ item.1 }}"
      register: talep_pages
      changed_when: false

    - name: "03a - DEBUG: Ham API yaniti (ilk sayfa)"
      ansible.builtin.debug:
        msg:
          status_code: "{{ talep_pages.results[0].status_code | default('yok') }}"
          content_type: "{{ talep_pages.results[0].content_type | default('yok') }}"
          content_veri_tipi: "{{ talep_pages.results[0].content | type_debug }}"
          ham_metin: "{{ talep_pages.results[0].content | default('') | truncate(1500) }}"
          kayit_sayisi: "{{ (talep_pages.results[0].content | default('[]', true) | from_json) | length }}"
          ilk_kayit_anahtarlari: >-
            {%- set parsed = talep_pages.results[0].content | default('[]', true) | from_json -%}
            {{ (parsed[0].keys() | list) if (parsed | length > 0) else 'kayit_yok' }}

    - name: "03b - Talep listesini birlestir"
      ansible.builtin.set_fact:
        talepler: >-
          {%- set out = [] -%}
          {%- for r in talep_pages.results -%}
            {%- for t in (r.content | default('[]', true) | from_json) -%}
              {%- if t.id is defined and t.id -%}
                {%- set _ = out.append({
                      'environment': r.item.0,
                      'id': t.id | string,
                      'platform': (t.platform.description | default('bilinmiyor')),
                      'recordDate': t.recordDate | default('') }) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out | unique }}

    - name: "04 - Tespit ozeti"
      ansible.builtin.debug:
        msg: >-
          {{ talepler | length }} adet YT talep:
          {{ talepler | map(attribute='environment') | zip(talepler | map(attribute='id')) | list }}

    - name: "04b - Talep yoksa bitir"
      ansible.builtin.meta: end_play
      when: talepler | length == 0

    # ========================================================
    # 05 - Bildirim maili (DIAG uzerinden - mailgw sadece oradan acik)
    # ========================================================
    - name: "05 - Bildirim maili"
      ansible.windows.win_powershell:
        script: |
          $b = @'
          {% for t in talepler %}
          Ortam: {{ t.environment }} | TalepID: {{ t.id }} | Platform: {{ t.platform }} | Kayit: {{ t.recordDate }}
          {% endfor %}
          '@
          Send-MailMessage -SmtpServer '{{ mail_smtp_host }}' -Port {{ mail_smtp_port }} `
              -From '{{ mail_from }}' -To '{{ mail_to }}' `
              -Subject 'Front Deploy - {{ talepler | length }} YT talep tespit edildi' -Body $b
      changed_when: false
      failed_when: false

    # ========================================================
    # 06 - Get-TalepDetay (item/artiPath)
    # ========================================================
    - name: "06 - Talep detaylarini cek"
      ansible.windows.win_uri:
        url: "{{ web_service_url }}/comprepo-deployment-request-details?search=deploymentRequest.id:IN({{ item.id }})"
        method: GET
        headers:
          Authorization: "Bearer {{ deploy_token }}"
        return_content: true
      loop: "{{ talepler }}"
      loop_control:
        label: "{{ item.environment }}/{{ item.id }}"
      register: detay_result
      when: enable_processing | bool
      changed_when: false

    - name: "06b - Indirilecek item listesi (itemName+artiPath tekil)"
      ansible.builtin.set_fact:
        download_items: >-
          {%- set out = [] -%}
          {%- set seen = [] -%}
          {%- for r in detay_result.results -%}
            {%- for d in (r.content | default('[]', true) | from_json) -%}
              {%- set key = (r.item.id | string) ~ '|' ~ (d.itemName | default('')) ~ '|' ~ (d.artipath | default(d.artiPath | default(''))) -%}
              {%- if key not in seen and (d.artipath | default(d.artiPath | default(''))) -%}
                {%- set _ = seen.append(key) -%}
                {%- set _ = out.append({
                      'environment': r.item.environment,
                      'talepId': r.item.id | string,
                      'itemName': d.itemName,
                      'artiPath': d.artipath | default(d.artiPath),
                      'fileName': (d.artipath | default(d.artiPath)) | basename }) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ out }}
      when: enable_processing | bool

    # ========================================================
    # 07 - INDIRME (DIAG uzerinde staging) - artifact repo sadece
    #      DIAG'dan erisilebilir oldugu icin burada.
    # ========================================================
    - name: "07 - Staging dizinleri"
      ansible.windows.win_file:
        path: "{{ win_stage_dir }}\\{{ item.talepId }}"
        state: directory
      loop: "{{ download_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}"
      when: enable_processing | bool

    - name: "07b - Artifact indir (DIAG)"
      ansible.windows.win_get_url:
        url: "{{ item.artiPath }}"
        dest: "{{ win_stage_dir }}\\{{ item.talepId }}\\{{ item.fileName }}"
        timeout: "{{ http_timeout_seconds }}"
      loop: "{{ download_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}/{{ item.fileName }}"
      register: dl_result
      failed_when: false
      when: enable_processing | bool

    # ========================================================
    # 08 - DIAG -> EE (OCP pod) dosya transferi
    # ========================================================
    - name: "08 - Dosyalari EE'ye cek"
      ansible.builtin.fetch:
        src: "{{ win_stage_dir }}\\{{ item.talepId }}\\{{ item.fileName }}"
        dest: "{{ ee_stage_dir }}/{{ item.talepId }}/{{ item.fileName }}"
        flat: true
      loop: "{{ download_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}/{{ item.fileName }}"
      register: fetch_result
      failed_when: false
      when: enable_processing | bool

    # ========================================================
    # 09 - NetApp'e YAZMA  (EE / OpenShift pod - SMB bu IP'den acik)
    # ========================================================
    - name: "09 - NetApp dizin agaci (smbclient, OCP node IP'sinden)"
      ansible.builtin.command:
        argv:
          - smbclient
          - "{{ repo_shares[env_repo_share[item.environment]] }}"
          - "-m"
          - "SMB3"
          - "-U"
          - "{{ smb_user }}%{{ smb_password }}"
          - "-c"
          - >-
            prompt OFF; recurse OFF;
            {% for p in [item.environment, dt.year, dt.month, dt.day, item.talepId] %}mkdir "{{ p }}"; cd "{{ p }}"; {% endfor %}ls
      loop: "{{ download_items | default([]) }}"
      loop_control:
        label: "{{ item.environment }}/{{ item.talepId }}"
      delegate_to: localhost
      failed_when: false          # mevcut dizin NT_STATUS_OBJECT_NAME_COLLISION doner
      changed_when: false
      no_log: true
      when: enable_processing | bool

    - name: "09b - Dosyayi NetApp'e yaz"
      ansible.builtin.command:
        argv:
          - smbclient
          - "{{ repo_shares[env_repo_share[item.environment]] }}"
          - "-m"
          - "SMB3"
          - "-U"
          - "{{ smb_user }}%{{ smb_password }}"
          - "-D"
          - "{{ item.environment }}\\{{ dt.year }}\\{{ dt.month }}\\{{ dt.day }}\\{{ item.talepId }}"
          - "-c"
          - 'prompt OFF; put "{{ ee_stage_dir }}/{{ item.talepId }}/{{ item.fileName }}" "{{ item.fileName }}"'
      loop: "{{ download_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}/{{ item.fileName }}"
      delegate_to: localhost
      register: push_result
      failed_when: false
      no_log: true
      when: enable_processing | bool

    - name: "09c - Yazma sonuclari"
      ansible.builtin.debug:
        msg: "{{ item.item.talepId }}/{{ item.item.fileName }} -> {{ 'OK' if item.rc == 0 else 'HATA: ' ~ (item.stderr | default(item.stdout) | truncate(200)) }}"
      loop: "{{ push_result.results | default([]) }}"
      loop_control:
        label: "{{ item.item.fileName | default('-') }}"
      when: enable_processing | bool

    # ========================================================
    # 10 - Basarili / hatali degerlendirme
    # ========================================================
    - name: "10 - Basarili ve hatali itemleri belirle"
      ansible.builtin.set_fact:
        basarili_items: >-
          {%- set out = [] -%}
          {%- for r in (push_result.results | default([])) -%}
            {%- if (r.rc | default(1)) == 0 -%}{% set _ = out.append(r.item) %}{%- endif -%}
          {%- endfor -%}
          {{ out }}
        hatali_items: >-
          {%- set out = [] -%}
          {%- for r in (push_result.results | default([])) -%}
            {%- if (r.rc | default(1)) != 0 -%}{% set _ = out.append(r.item) %}{%- endif -%}
          {%- endfor -%}
          {{ out }}
      when: enable_processing | bool

    - name: "10b - Talep bazli ozet (yalnizca raporlama - statu API'si CAGRILMAZ)"
      ansible.builtin.set_fact:
        hatali_talep_ids: "{{ hatali_items | map(attribute='talepId') | unique | list }}"
      when: enable_processing | bool

    - name: "10c - Talep bazli sonuc"
      ansible.builtin.set_fact:
        basarili_talepler: "{{ talepler | rejectattr('id', 'in', hatali_talep_ids) | list }}"
        hatali_talepler: "{{ talepler | selectattr('id', 'in', hatali_talep_ids) | list }}"
      when: enable_processing | bool

    - name: "10d - Sonuc ozeti"
      ansible.builtin.debug:
        msg: >-
          Toplam {{ download_items | length }} item |
          Basarili: {{ basarili_items | length }} |
          Hatali: {{ hatali_items | length }}
          {{ ('(hatali talepler: ' ~ (hatali_talep_ids | join(', ')) ~ ')') if hatali_talep_ids | length > 0 else '' }}
      when: enable_processing | bool

    # ========================================================
    # 10e-10f - Sonuc raporu maili (HTML + basit bar chart)
    # ========================================================
    - name: "10e - HTML rapor olustur"
      ansible.builtin.set_fact:
        rapor_html: >-
          {%- set toplam = (download_items | default([]) | length) -%}
          {%- set b_sayi = (basarili_items | default([]) | length) -%}
          {%- set h_sayi = (hatali_items | default([]) | length) -%}
          {%- set b_pct = ((b_sayi / toplam * 100) | round(0, 'floor') | int) if toplam > 0 else 0 -%}
          {%- set h_pct = (100 - b_pct) if toplam > 0 else 0 -%}
          <div style="font-family:Segoe UI,Arial,sans-serif;max-width:640px;">
          <h2 style="margin-bottom:4px;">Front Deploy - Repo to FS Sonuc Raporu</h2>
          <p style="color:#666;margin-top:0;">{{ dt.day }}.{{ dt.month }}.{{ dt.year }} | Calisma modu: {{ calisma_modu }}</p>
          <table style="border-collapse:collapse;width:100%;margin-bottom:12px;">
          <tr><td style="padding:4px;">Toplam item</td><td style="padding:4px;text-align:right;">{{ toplam }}</td></tr>
          <tr><td style="padding:4px;color:#2e7d32;">Basarili</td><td style="padding:4px;text-align:right;color:#2e7d32;">{{ b_sayi }}</td></tr>
          <tr><td style="padding:4px;color:#c62828;">Hatali</td><td style="padding:4px;text-align:right;color:#c62828;">{{ h_sayi }}</td></tr>
          </table>
          <div style="background:#eee;border-radius:4px;overflow:hidden;height:22px;width:100%;">
          <div style="background:#2e7d32;height:22px;width:{{ b_pct }}%;float:left;"></div>
          <div style="background:#c62828;height:22px;width:{{ h_pct }}%;float:left;"></div>
          </div>
          <p style="font-size:12px;color:#666;">Yesil: basarili (%{{ b_pct }}) / Kirmizi: hatali (%{{ h_pct }})</p>
          <h3 style="margin-bottom:4px;">Ortam bazinda</h3>
          <table style="border-collapse:collapse;width:100%;">
          <tr style="background:#f5f5f5;"><th style="text-align:left;padding:4px;">Ortam</th><th style="text-align:right;padding:4px;">Basarili</th><th style="text-align:right;padding:4px;">Hatali</th></tr>
          {%- for env in deploy_environments %}
          {%- set env_b = basarili_items | default([]) | selectattr('environment', 'equalto', env) | list | length %}
          {%- set env_h = hatali_items | default([]) | selectattr('environment', 'equalto', env) | list | length %}
          <tr><td style="padding:4px;">{{ env }}</td><td style="padding:4px;text-align:right;">{{ env_b }}</td><td style="padding:4px;text-align:right;color:{{ '#c62828' if env_h > 0 else '#333' }};">{{ env_h }}</td></tr>
          {%- endfor %}
          </table>
          </div>
      when: enable_processing | bool

    - name: "10f - Sonuc raporu maili"
      ansible.windows.win_powershell:
        script: |
          $html = @'
          {{ rapor_html }}
          '@
          Send-MailMessage -SmtpServer '{{ mail_smtp_host }}' -Port {{ mail_smtp_port }} `
              -From '{{ mail_from }}' -To '{{ mail_to }}' `
              -Subject 'Front Deploy Sonuc - {{ hatali_items | default([]) | length }} hatali / {{ download_items | default([]) | length }} toplam ({{ calisma_modu }})' `
              -Body $html -BodyAsHtml
      changed_when: false
      failed_when: false
      when: enable_processing | bool

    # ========================================================
    # 11-14 - STATU GUNCELLEMELERI  [enable_status_updates]
    # Varsayilan KAPALI. false oldugu surece bu 4 adim tamamen
    # atlanir - KYS kayitlarina hicbir POST gitmez.
    # ========================================================
    - name: "11 - TalepDetay KD/65 (basarili item)"
      ansible.windows.win_uri:
        url: "{{ web_service_url }}/comprepo-deployment-request-details/{{ item.talepId }}/update-details?itemName={{ item.itemName | urlencode }}&state=KD&flowStatus=65"
        method: POST
        headers:
          Authorization: "Bearer {{ deploy_token }}"
      loop: "{{ basarili_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}/{{ item.itemName }}"
      when: enable_status_updates | bool

    - name: "12 - TalepDetay KW/63 (hatali item)"
      ansible.windows.win_uri:
        url: "{{ web_service_url }}/comprepo-deployment-request-details/{{ item.talepId }}/update-details?itemName={{ item.itemName | urlencode }}&state=KW&flowStatus=63"
        method: POST
        headers:
          Authorization: "Bearer {{ deploy_token }}"
      loop: "{{ hatali_items | default([]) }}"
      loop_control:
        label: "{{ item.talepId }}/{{ item.itemName }}"
      failed_when: false
      when: enable_status_updates | bool

    - name: "13 - Talep statusu (KD/65 basarili - KW/63 hatali)"
      ansible.windows.win_uri:
        url: >-
          {{ web_service_url }}/comprepo-deployment-requests/{{ item.0.id }}/change-state?state={{ item.1.state }}&flowStatus={{ item.1.flow }}&explanation={{ item.1.desc | urlencode }}
        method: POST
        headers:
          Authorization: "Bearer {{ deploy_token }}"
      loop: >-
        {{ (basarili_talepler | default([]) | product([{'state':'KD','flow':65,'desc':'RepotoFS Basarili'}]) | list)
           + (hatali_talepler  | default([]) | product([{'state':'KW','flow':63,'desc':'RepotoFS Hatali!'}]) | list) }}
      loop_control:
        label: "{{ item.0.environment }}/{{ item.0.id }} -> {{ item.1.state }}"
      failed_when: false
      when: enable_status_updates | bool

    - name: "14 - Release history"
      ansible.windows.win_uri:
        url: "{{ web_service_url }}/deploy-releases/{{ item.id }}?state={{ 'KW' if item.id in hatali_talep_ids else 'KD' }}&desc={{ ('RepotoFS ' ~ ('Hatali!' if item.id in hatali_talep_ids else 'Basarili')) | urlencode }}"
        method: POST
        headers:
          Authorization: "Bearer {{ deploy_token }}"
      loop: "{{ talepler }}"
      loop_control:
        label: "{{ item.environment }}/{{ item.id }}"
      failed_when: false
      when: enable_status_updates | bool

    # ========================================================
    # 15 - Temizlik
    # ========================================================
    - name: "15 - Staging temizligi (DIAG)"
      ansible.windows.win_file:
        path: "{{ win_stage_dir }}"
        state: absent
      when: enable_processing | bool
      failed_when: false

    - name: "15b - Staging temizligi (EE)"
      ansible.builtin.file:
        path: "{{ ee_stage_dir }}"
        state: absent
      delegate_to: localhost
      when: enable_processing | bool
      failed_when: false